<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration | Village Farming Directory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Shared Website CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .registration-card {
            max-width: 850px;
            width: 100%;
        }

        .registration-icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 10px;
        }

        .registration-subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 25px;
        }

        .registration-section {
            background-color: #eaf5ed;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .registration-section h5 {
            color: #146c43;
            font-weight: 700;
            margin: 0;
        }

        .registration-footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="custom-card registration-card">

            <!-- Heading -->
            <div class="registration-icon">🌾</div>

            <h2 class="page-heading text-center">
                Farmer Registration
            </h2>

            <p class="registration-subtitle">
                Join the Village Farming Directory
            </p>

            <!-- Error Message -->
            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <!-- Success Message -->
            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}"
                  th:object="${farmer}"
                  method="post">

                <!-- PERSONAL INFORMATION -->
                <div class="registration-section">
                    <h5>👤 Personal Information</h5>
                </div>

                <div class="row">

                    <!-- Full Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{fullName}"
                               placeholder="Enter your full name"
                               required>

                    </div>

                    <!-- Mobile Number -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input type="tel"
                               class="form-control"
                               th:field="*{mobile}"
                               placeholder="Enter 10-digit mobile number"
                               pattern="[6-9][0-9]{9}"
                               maxlength="10"
                               required>

                    </div>

                    <!-- Village -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Village
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{village}"
                               placeholder="Enter your village name"
                               required>

                    </div>

                </div>

                <!-- ACCOUNT INFORMATION -->
                <div class="registration-section">
                    <h5>🔐 Account Information</h5>
                </div>

                <div class="row">

                    <!-- Username -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{username}"
                               placeholder="Choose a username"
                               required>

                    </div>

                    <!-- Password -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               name="password"
                               placeholder="Create a password"
                               minlength="6"
                               required>

                    </div>

                    <!-- Confirm Password -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input type="password"
                               class="form-control"
                               name="confirmPassword"
                               placeholder="Enter password again"
                               minlength="6"
                               required>

                    </div>

                </div>

                <!-- FARMING INFORMATION -->
                <div class="registration-section">
                    <h5>🌱 Farming Information</h5>
                </div>

                <div class="row">

                    <!-- Land Area -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Land Area
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{landArea}"
                               step="0.01"
                               min="0"
                               placeholder="Enter land area"
                               required>

                    </div>

                    <!-- Land Unit -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Land Unit
                        </label>

                        <select class="form-select"
                                th:field="*{landUnit}"
                                required>

                            <option value="">
                                Select unit
                            </option>

                            <option value="Acres">
                                Acres
                            </option>

                            <option value="Hectares">
                                Hectares
                            </option>

                        </select>

                    </div>

                    <!-- Crops -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Crops Cultivated
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{crops}"
                               placeholder="Example: Rice, Cotton, Maize"
                               required>

                    </div>

                    <!-- Crop Season -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Crop Season
                        </label>

                        <select class="form-select"
                                th:field="*{cropSeason}"
                                required>

                            <option value="">
                                Select crop season
                            </option>

                            <option value="Kharif">
                                Kharif
                            </option>

                            <option value="Rabi">
                                Rabi
                            </option>

                            <option value="Zaid">
                                Zaid
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

                <!-- REGISTER BUTTON -->
                <button type="submit"
                        class="btn btn-green w-100 mt-3">

                    Register Farmer

                </button>

                <!-- LOGIN LINK -->
                <div class="registration-footer">

                    <p class="mb-2">
                        Already registered?
                        <a th:href="@{/login}"
                           class="text-success fw-bold text-decoration-none">
                            Login here
                        </a>
                    </p>

                    <p class="small">
                        Supporting farmers and agriculture 🌱
                    </p>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
